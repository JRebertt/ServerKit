name: Release Build Smoke Test

# Validates that the release tarball can be built successfully. This catches
# release-script-specific issues (e.g. overly broad rsync excludes that omit
# frontend source files) before they reach main, instead of failing late in the
# release workflow.

# main is deliberately absent from `push`: on a merge to main, release.yml's
# `build-release` job runs this very script for real moments later, so building
# the tarball here too was pure duplication.
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/release-smoke.yml'
      - '.github/workflows/release.yml'
      - 'VERSION'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/release-smoke.yml'
      - '.github/workflows/release.yml'
      - 'VERSION'

jobs:
  build-release-smoke:
    name: Build release tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-pip rsync

      - name: Run release build script
        run: bash scripts/build-release.sh

  # The tarball job above proves the *source* packaging. This one proves the
  # *image* packaging, which is a different artifact with a different file list
  # -- and the one that shipped issue #101 (the panel serves scripts/install.sh
  # off its own disk; the Dockerfile never copied it, so every containerised
  # panel 404'd the enrollment URL its own UI prints). Booting the image is the
  # only check that sees it: pytest runs against the source tree, where the file
  # is always present.
  docker-image-smoke:
    name: Boot the Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: serverkit:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        run: SKIP_BUILD=1 bash scripts/test/smoke-docker-image.sh serverkit:smoke
