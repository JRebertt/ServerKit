id: meilisearch
name: Meilisearch
version: "1.12"
description: Lightning-fast, typo-tolerant search engine that many apps rely on for instant full-text search.
icon: https://serverkit.ai/imgs/template-icons/meilisearch.svg
website: https://www.meilisearch.com
documentation: https://www.meilisearch.com/docs
categories:
  - search
  - database

# Marks this template as an installable database engine. Presence of this block
# is the ONLY thing that lists it in Databases -- adding it to an existing
# template is all it takes.
engine:
  family: Search
  # No SQL/Mongo/Redis client can introspect Meilisearch, so the database tree
  # offers no browsing for it rather than pretending otherwise.
  protocol: none
  default_port: 7700
  # Meilisearch has no user concept -- it authenticates with a master key.
  admin_password_var: MASTER_KEY
  port_var: HTTP_PORT
  bind_var: BIND_ADDRESS
  unit: indexes
  client: curl
  data_path: /meili_data
  version_var: IMAGE_TAG
  versions:
    - "1.12"

variables:
  - name: IMAGE_TAG
    type: string
    default: "1.12"
    hidden: true
    description: Image tag; constrained to engine.versions by the installer
  - name: HTTP_PORT
    description: Host port for the Meilisearch HTTP API
    type: port
    default: "7700"
    hidden: false
  - name: BIND_ADDRESS
    description: Address the port binds to. 127.0.0.1 keeps the engine private.
    type: string
    default: 127.0.0.1
    hidden: true
  - name: MASTER_KEY
    description: Master key protecting the Meilisearch API (auto-generated)
    type: random
    length: 48
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Meilisearch HTTP API

requirements:
  memory: 512MB
  storage: 1GB

compose:
  services:
    meilisearch:
      # Note the leading "v" -- Meilisearch tags are v1.12, not 1.12.
      image: getmeili/meilisearch:v${IMAGE_TAG}
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        # Private by default; the installer swaps BIND_ADDRESS to 0.0.0.0 only
        # on an explicit expose_public opt-in.
        - "${BIND_ADDRESS}:${HTTP_PORT}:7700"
      environment:
        MEILI_MASTER_KEY: "${MASTER_KEY}"
        MEILI_ENV: "production"
        MEILI_NO_ANALYTICS: "true"
      volumes:
        - meilisearch-data:/meili_data
      healthcheck:
        test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
        interval: 10s
        timeout: 10s
        retries: 5
        start_period: 20s

  volumes:
    meilisearch-data:

post_install: |
  Meilisearch is installed and running!

  - API endpoint: http://your-server:${HTTP_PORT}
  - Master key: ${MASTER_KEY}

  Send the master key as the `Authorization: Bearer ${MASTER_KEY}` header on every
  request. Create scoped API keys from the `/keys` endpoint for your apps instead of
  sharing the master key directly.
